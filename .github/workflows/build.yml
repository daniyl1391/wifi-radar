name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o WifiRadar.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure gradle.properties
        working-directory: WifiRadar
        run: |
          touch gradle.properties
          grep -q "useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "nonTransitiveRClass" gradle.properties || echo "android.nonTransitiveRClass=true" >> gradle.properties

      - name: Force-fix manifest theme
        working-directory: WifiRadar
        run: |
          sed -i 's#android:theme="[^"]*"#android:theme="@android:style/Theme.Material.NoActionBar"#' app/src/main/AndroidManifest.xml
          cat app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: WifiRadar
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-radar-debug-apk
          path: WifiRadar/app/build/outputs/apk/debug/app-debug.apk
