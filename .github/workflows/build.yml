name: Discover and Build V2rayNG Base

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Clone v2rayNG upstream
        run: git clone --depth 1 https://github.com/2dust/v2rayNG.git

      - name: List project structure (2 levels)
        run: find v2rayNG -maxdepth 3 -type d | sort

      - name: Show app build.gradle
        run: find v2rayNG -name "build.gradle*" -path "*app*" -exec cat {} \;

      - name: Show AndroidManifest
        run: find v2rayNG -name "AndroidManifest.xml" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Search for app name references
        run: grep -rn "v2rayNG\|V2RayNG\|app_name" v2rayNG --include="*.xml" --include="*.kt" -l | head -30

      - name: Show strings.xml (main)
        run: find v2rayNG -name "strings.xml" -path "*values/*" -not -path "*values-*" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Show colors.xml
        run: find v2rayNG -name "colors.xml" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: List launcher icon resources
        run: find v2rayNG -iname "*ic_launcher*" -o -iname "*ic_logo*" | head -40

      - name: Find About / Settings screens
        run: grep -rln "About\|Github\|github.com/2dust" v2rayNG --include="*.kt" | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Try baseline build (unmodified)
        working-directory: v2rayNG
        continue-on-error: true
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -100

      - name: Upload baseline APK if built
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-apk-and-logs
          path: |
            v2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
